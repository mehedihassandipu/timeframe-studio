<style>
:root,:root[data-theme=dark]{--bg:#000;--p1:#000;--p2:#0b0b0b;--p3:#171717;--ln:#262626;--ln2:#3d3d3d;--tx:#fff;--mu:#9c9c9c;--dim:#6f6f6f;--inv:#fff;--invtx:#000;--ws:#000;--dot:#2c2c2c;--rul:#000;--rulpg:#151515;--spo:#2c2c2c;--spi:#fff;--tick:#fff;--warn:#f0c75e;--err:#ff8a8a;--shadow:none;--crop:#8c8c8c;--overlay:rgba(0,0,0,.74);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.4 var(--ui)}

#bCopy{font:400 11px/1.2 var(--mono);letter-spacing:.08em;padding:9px 16px}#bExport{padding:10px 18px}
